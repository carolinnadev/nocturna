<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo · Rueda Nocturna</title>
    <!-- 1. Carga del Play CDN de Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">

    <!-- Sección principal (Hero) -->
    <main class="max-w-2xl w-full text-center space-y-6 bg-gray-800/60 p-8 rounded-2xl border border-gray-700 shadow-2xl backdrop-blur-sm">
        
        <!-- Etiqueta de campaña -->
        <span class="inline-block px-3 py-1 bg-amber-500/10 text-amber-400 text-xs font-semibold tracking-wider uppercase rounded-full border border-amber-500/20">
        Nuevo · Jueves a sábado
        </span>

        <!-- Título principal (Único <h1>) -->
        <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight">
        Rueda Nocturna
        </h1>

        <!-- Subtítulo -->
        <p class="text-lg text-gray-300 max-w-lg mx-auto">
        Descubre Medellín en bici cuando se encienden las luces
        </p>

        <!-- Datos destacados -->
        <div class="flex justify-center items-center gap-8 py-4">
        <div class="text-center">
            <p class="text-2xl font-bold text-amber-400">3 rutas</p>
            <p class="text-xs text-gray-400 uppercase tracking-wider">Disponibles</p>
        </div>
        <div class="h-8 w-px bg-gray-700"></div>
        <div class="text-center">
            <p class="text-2xl font-bold text-amber-400">Desde $55.000</p>
            <p class="text-xs text-gray-400 uppercase tracking-wider">Por persona</p>
        </div>
        </div>

        <!-- Enlace "Inscríbete" con apariencia de botón -->
        <div>
        <a href="#inscripcion" 
            class="inline-block bg-amber-500 text-gray-950 font-bold px-8 py-3 rounded-lg shadow-lg hover:bg-amber-400 transition-all duration-200 uppercase tracking-wide text-sm">
            Inscríbete
        </a>
        </div>

    </main>

    </body>
</html>
